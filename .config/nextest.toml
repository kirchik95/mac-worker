# cargo-nextest configuration. See docs/testing.md.
#
# Each test runs in its own process, so tests that change the process working
# directory, HOME or process-wide settings cannot disturb each other, and tests
# from different binaries run in parallel.

[profile.default]
fail-fast = false
retries = 0
# A test that runs past 3 minutes is reported slow after 60 s and then killed.
# A few inherently heavy cycles override terminate-after below; they stay bounded.
slow-timeout = { period = "60s", terminate-after = 3 }

[test-groups]
# Heavy repetition kept for nightly runs (`_stress` tests are #[ignore]d).
stress = { max-threads = 1 }
# Real fork, signal and process-group tests. Keep a few in flight so they do not
# starve each other of time slices around their deadlines.
fork_heavy = { max-threads = 4 }
# Native integration cycles share CPU with Git, workers and auxiliary turns.
native_integration = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/_stress$/)'
test-group = 'stress'
slow-timeout = { period = "300s", terminate-after = 4 }

[[profile.default.overrides]]
# Keep the former integration modules in this group, without selecting library
# unit tests such as supervisor::tests::*.
filter = '(binary(host) | binary(task)) & test(/^(supervisor|job_queries|task_turn)::/)'
test-group = 'fork_heavy'

[[profile.default.overrides]]
filter = '''
  (binary(task) & (
    test(/^task_integration_direct::/)
    | test(/^task_integration_turns::direct_followup_repairs_failed_checks_and_integrates_both_turns$/)
  ))
  | (binary(controller) & (
    test(/^controller_integration_wiring::native_controller_shutdown_preserves_undrained_dispatch_across_restart$/)
    | test(/^controller_integration_wiring::verified_nested_source_keeps_request_pins_and_retires_the_unadopted_task_pin$/)
    | test(/^controller_integration_wiring::acknowledged_nested_wrapper_releases_both_pins_and_replays_without_recapture$/)
    | test(/^controller_integration_wiring::host_command_arms_the_prepared_task_without_running_a_merge$/)
    | test(/^controller_integration_wiring::fetch_only_integrating_batch_freezes_own_origin_before_any_task_effect$/)
  ))
'''
test-group = 'native_integration'
# First matching override that sets a setting wins. `_stress` is earlier and
# keeps its own slow-timeout. Every test in this class otherwise dies at 360 s.
slow-timeout = { period = "60s", terminate-after = 6 }

[[profile.default.overrides]]
# Real git and worker cycles, plus one auxiliary case that must wait out a 60 s
# timeout. Serial runs on a machine already at load 16–40 took 73–106 s
# (fresh_operator_reconcile 90 s, never_receipt 106 s, a_running_auxiliary 102 s,
# a_brief_helper_rollback 85 s, native_union 74 s, native_dag 73 s). The full
# gate runs native_integration two at a time beside the rest of the suite and
# killed only fresh_operator_reconcile at 180 s. Two other direct cycles
# finished at 176 s and 172 s and were not killed.
# The disconnect matrix is 24 real task-turn lifecycles and the slower host
# matrix: 62–79 s in a normal gate, 73 s serial at load ~35–50, idle reference
# 58 s. The prelaunch-evidence matrix is 28 lifecycles: 39 s serial at that
# load, idle reference 26 s. Both hit the 180 s kill in the gate.
# publication-crash frontiers took 119 s in a loaded gate; envelope pruning
# took 160.7 s. Six 60 s periods is 360 s, still a hard kill.
# Direct cycles above are already covered by the native_integration override.
# Listed again so this block stays the explicit record; the earlier override
# supplies their slow-timeout. Host matrices and the two tests below are not
# in that class.
filter = '''
  (binary(task) & (
    test(/^task_integration_direct::never_receipt_is_idempotent_and_the_next_say_uses_its_accepted_head$/)
    | test(/^task_integration_direct::a_running_auxiliary_times_out_while_the_native_owner_gate_is_drained$/)
    | test(/^task_integration_direct::fresh_operator_reconcile_confirms_dead_integration_driver_and_retained_actor$/)
    | test(/^task_integration_direct::a_brief_helper_rollback_parks_and_restores_the_same_open_source_cycle$/)
    | test(/^task_integration_direct::native_union_uses_frozen_h_attributes_and_pinned_verification_before_receipt_import$/)
    | test(/^task_integration_direct::native_dag_uses_the_imported_parent_merge_for_its_configured_child$/)
  ))
  | (binary(host) & (
    test(/^job_queries::task_turn_ports::task_turn_acceptance_disconnect_matrix_preserves_all_24_boundary_order_classes$/)
    | test(/^job_queries::task_turn_ports::task_turn_status_preserves_unsafe_or_conflicting_prelaunch_evidence$/)
    | test(/^job_queries::task_turn_ports::task_turn_publication_crash_frontiers_recover_and_execute_exactly_once$/)
  ))
  | test(/^controller::envelope::tests::pruning_wraps_and_limits_each_call_to_256_envelopes$/)
'''
slow-timeout = { period = "60s", terminate-after = 6 }

[profile.ci]
fail-fast = false
retries = 1
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
