name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full suite nightly; pushes and pull requests run the fast tier only.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - name: Verify embedded dashboard assets
        shell: bash
        run: |
          asset_dir="$(mktemp -d "${RUNNER_TEMP}/dashboard-ui.XXXXXX")"
          trap 'rm -rf "$asset_dir"' EXIT
          (cd ui && npm run build -- --outDir "$asset_dir")
          diff -r "$asset_dir" src/dashboard/static/app

  rust:
    # Fast tier: formatting, lints and library/binary unit tests. The full
    # integration suite runs nightly, on demand and in the release workflow;
    # run it locally before landing larger changes.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: /private/tmp/mac-worker-dashboard-stage4-target
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check production graph without test support
        run: CARGO_BUILD_JOBS=4 cargo clippy --locked --release --no-default-features --lib --bin worker -- -D warnings
      - run: cargo test --locked --lib --bins --no-fail-fast

  rust-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: /private/tmp/mac-worker-dashboard-stage4-target
      # The hosted runner has little memory to spare for a RAM disk.
      MAC_WORKER_GATE_RAMDISK_MB: "0"
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add rustfmt clippy
      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/mac | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check production graph without test support
        run: CARGO_BUILD_JOBS=4 cargo clippy --locked --release --no-default-features --lib --bin worker -- -D warnings
      - run: scripts/test-gate.sh --profile ci
      - name: Stress tests
        run: scripts/test-gate.sh --profile ci --run-ignored only -E 'test(/_stress$/)'
