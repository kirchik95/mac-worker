name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - name: Verify embedded dashboard assets
        shell: bash
        run: |
          asset_dir="$(mktemp -d "${RUNNER_TEMP}/dashboard-ui.XXXXXX")"
          trap 'rm -rf "$asset_dir"' EXIT
          (cd ui && npm run build -- --outDir "$asset_dir")
          diff -r "$asset_dir" src/dashboard/static/app

  build-draft:
    needs: ui
    runs-on: macos-15
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Verify source and installer
        run: |
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          scripts/test-install.sh

      - name: Build release assets
        run: scripts/package-release.sh "$GITHUB_REF_NAME" dist

      - name: Inspect release archive
        run: |
          file dist/mac-worker-*-aarch64-apple-darwin.tar.gz
          tar -tzf dist/mac-worker-*-aarch64-apple-darwin.tar.gz
          (cd dist && shasum -a 256 -c mac-worker-*.tar.gz.sha256)

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/mac-worker-*-aarch64-apple-darwin.tar.gz
          dist/mac-worker-*-aarch64-apple-darwin.tar.gz.sha256
          dist/mac-worker.rb
          --draft
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
