name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-draft:
    runs-on: macos-14
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Install Rust quality components
        run: rustup component add rustfmt clippy

      - name: Verify source and installer
        run: |
          cargo fmt --all --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          scripts/test-install.sh

      - name: Build release assets
        run: scripts/package-release.sh "$GITHUB_REF_NAME" dist

      - name: Inspect release archive
        run: |
          file dist/mac-worker-*-aarch64-apple-darwin.tar.gz
          tar -tzf dist/mac-worker-*-aarch64-apple-darwin.tar.gz
          (cd dist && shasum -a 256 -c mac-worker-*.tar.gz.sha256)

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/mac-worker-*-aarch64-apple-darwin.tar.gz
          dist/mac-worker-*-aarch64-apple-darwin.tar.gz.sha256
          dist/mac-worker.rb
          --draft
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
